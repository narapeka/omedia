name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: echo "$DOCKERHUB_PASSWORD" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Enable arm64 emulation
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name omedia-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and push Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t docker.io/${DOCKERHUB_USERNAME}/omedia:${TAG_NAME} \
            -t docker.io/${DOCKERHUB_USERNAME}/omedia:latest \
            --push \
            .
          docker buildx imagetools inspect docker.io/${DOCKERHUB_USERNAME}/omedia:${TAG_NAME}

  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $version = $tagName -replace '^v', ''
          .\scripts\package-win.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = "dist\installer\omedia-setup-v$version.exe"
          $target = "dist\installer\omedia-setup-$tagName.exe"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Expected installer not found: $source"
          }
          if ($source -ne $target) {
            Copy-Item -LiteralPath $source -Destination $target -Force
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/installer/omedia-setup-${{ github.ref_name }}.exe

  github-release:
    runs-on: ubuntu-latest
    needs:
      - docker
      - windows-installer
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Windows installer
        uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          export VERSION
          python3 - <<'PY' > release-notes.md
          from pathlib import Path
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^##\s+\[?v?{re.escape(version)}\]?(?:\s+-\s+.*)?\s*$", re.MULTILINE)
          match = heading.search(text)
          if not match:
              sys.exit(f"CHANGELOG.md does not contain a section for {version}")
          start = text.find("\n", match.end()) + 1
          next_heading = re.search(r"^##\s+", text[start:], re.MULTILINE)
          end = start + next_heading.start() if next_heading else len(text)
          section = text[start:end].strip()
          if not section:
              sys.exit(f"CHANGELOG.md section for {version} is empty")
          print(section)
          PY
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/*.exe --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "OMEDIA ${TAG_NAME}" --notes-file release-notes.md --draft=false --prerelease=false
          else
            gh release create "$TAG_NAME" release-assets/*.exe --repo "$GITHUB_REPOSITORY" --title "OMEDIA ${TAG_NAME}" --notes-file release-notes.md
          fi
