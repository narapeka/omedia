watch:
  poll_interval_seconds: 15.0
  stability_debounce_seconds: 30.0
tmdb:
  api_key: null
  base_url: https://api.themoviedb.org/3
  rate_limit: 10.0
  proxy: http://127.0.0.1:10809
llm:
  api_key: null
  base_url: https://api.x.ai/v1/
  model: grok-4-1-fast-non-reasoning
  batch_size: 50
  rate_limit: 2.0
  proxy: http://127.0.0.1:10809
organize:
  extensions:
    video:
    - .avi
    - .f4v
    - .flv
    - .iso
    - .m2ts
    - .m4v
    - .mkv
    - .mov
    - .mp4
    - .mpeg
    - .mpg
    - .tp
    - .ts
    - .webm
    - .wmv
    subtitle:
    - .ass
    - .idx
    - .pgs
    - .srt
    - .ssa
    - .sub
    - .sup
    sidecar:
    - .jpeg
    - .jpg
    - .nfo
    - .png
    - .txt
    - .webp
  min_non_subtitle_file_size_mb: 50
