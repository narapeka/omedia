<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="omedia-blade" x1="0.9" y1="0.1" x2="0.1" y2="0.9">
      <stop offset="0" stop-color="#C9A7FF"/>
      <stop offset="0.45" stop-color="#9155FD"/>
      <stop offset="1" stop-color="#6E2BD9"/>
    </linearGradient>
    <radialGradient id="omedia-hub" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#D3BBFF"/>
      <stop offset="1" stop-color="#9155FD"/>
    </radialGradient>
    <!-- One tapered blade: rounded head at 3 o'clock, tail sweeping
         clockwise and thinning out. Rotated x3 for the vortex "O". -->
    <path id="omedia-blade-shape"
          d="M 174 96
             A 80 80 0 0 1 61 156.62
             A 4 4 0 0 1 65 149.69
             A 60 60 0 0 0 142 96
             A 16 16 0 0 1 174 96
             Z"/>
    <!-- Wedge around the first blade's head, used to re-draw it on top
         so every tail tucks under the next head consistently. -->
    <clipPath id="omedia-head-clip">
      <polygon points="96,96 277,11.5 237,237"/>
    </clipPath>
  </defs>

  <use href="#omedia-blade-shape" fill="url(#omedia-blade)"/>
  <use href="#omedia-blade-shape" fill="url(#omedia-blade)" transform="rotate(120 96 96)"/>
  <use href="#omedia-blade-shape" fill="url(#omedia-blade)" transform="rotate(240 96 96)"/>
  <use href="#omedia-blade-shape" fill="url(#omedia-blade)" clip-path="url(#omedia-head-clip)"/>
  <circle cx="96" cy="96" r="14" fill="url(#omedia-hub)"/>
</svg>
